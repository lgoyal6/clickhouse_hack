# Person B's stack. Fully independent of the data track: no shared file, network, or
# volume. Reaches Person A's API and ClickHouse over host.docker.internal, so either
# side can be down without breaking the other.
#
#   docker compose -f librechat/chat.compose.yml up -d

services:
  librechat:
    # Built rather than pulled: the upstream Alpine image has no C compiler, and the
    # ClickHouse MCP needs to build lz4 from source on musl/aarch64. See the Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile
    image: status-clock/librechat:local
    ports: ["3080:3080"]
    # env_file, not ${VAR} substitution, for the secrets.
    #
    # Compose ranks the SHELL environment above --env-file, so an ANTHROPIC_API_KEY
    # exported as empty in the calling shell silently wins and the container boots
    # with no key. That happened here and cost a confusing round trip: the file was
    # correct, `docker compose config` showed "". env_file loads values straight into
    # the container and cannot be shadowed that way.
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      # LibreChat refuses to boot without these. They are its own encryption and
      # session secrets, generated locally by make -f Makefile.chat env; nothing is
      # signed up for and no external service is involved.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_EMAIL_LOGIN: ${ALLOW_EMAIL_LOGIN:-true}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devonly}
      # One container, one scheduler. Without this LibreChat refuses schedule writes
      # because it cannot prove it is the only replica.
      SCHEDULES_SINGLE_PROCESS: "true"
      # Person A hands you this. Read-only ClickHouse user.
      CH_READONLY_PASSWORD: ${CH_READONLY_PASSWORD}
      STATUS_CLOCK_API: http://host.docker.internal:8000
      CONFIG_PATH: /app/librechat.yaml
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ../agents:/app/agents:ro
      - ../contracts:/app/contracts:ro
      - ./uploads:/app/client/public/images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [mongodb, meilisearch]

  mongodb:
    image: mongo:7
    volumes: ["./mongodb-data:/data/db"]
    command: mongod --quiet --logpath /dev/null

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devonly}
      # One container, one scheduler. Without this LibreChat refuses schedule writes
      # because it cannot prove it is the only replica.
      SCHEDULES_SINGLE_PROCESS: "true"
    volumes: ["./meili-data:/meili_data"]
