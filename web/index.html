<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Clock</title>
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/components/FieldCard.css">
<style>
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 var(--space-6); }
  .topbar { display: flex; align-items: baseline; gap: var(--space-4);
    padding: var(--space-4) 0; flex-wrap: wrap; }
  .topbar__mark { font-family: var(--font-display); font-size: 1rem;
    letter-spacing: .1em; text-transform: uppercase; margin: 0; }
  .topbar__spacer { flex: 1; }
  .topbar a { font-family: var(--font-data); font-size: .8125rem; color: var(--stamp);
    text-decoration: none; padding-bottom: 2px; }
  .topbar a[aria-current="page"] { color: var(--ink);
    border-bottom: 2px solid var(--stamp); }
  .topbar a:hover { text-decoration: underline; }

  .hairline { border: 0; border-top: var(--hairline) solid var(--rule); margin: 0; }

  .controls { display: flex; gap: var(--space-6); flex-wrap: wrap;
    padding: var(--space-4) 0; align-items: flex-start; }
  .ctl__label { font-family: var(--font-display); font-size: .625rem;
    letter-spacing: .12em; text-transform: uppercase; color: var(--rule-text);
    margin: 0 0 var(--space-2); }
  .chips { display: flex; gap: 0; }
  .chip { font: inherit; font-family: var(--font-data); font-size: .8125rem;
    background: none; cursor: pointer; padding: var(--space-2) var(--space-3);
    border: var(--hairline) solid var(--rule); color: var(--ink);
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    transition: background 160ms ease, border-color 160ms ease; }
  .chip + .chip { border-left: 0; }
  .chip:hover { background: rgba(43,76,126,.05); }
  .chip[aria-pressed="true"] { border-color: var(--stamp); color: var(--stamp);
    box-shadow: inset 0 -2px 0 var(--stamp); }
  .chip[aria-pressed="true"] + .chip { border-left: 0; }
  .chip small { color: var(--rule-text); font-size: .6875rem; }
  .chip[aria-pressed="true"] small { color: var(--stamp); }

  .flag { display: flex; gap: var(--space-2); align-items: baseline;
    border-left: 2px solid var(--urgent); padding: var(--space-2) var(--space-3);
    margin-top: var(--space-6); font-size: .875rem; }
  .flag a { color: var(--stamp); }

  footer { padding: var(--space-6) 0 var(--space-8); font-family: var(--font-data);
    font-size: .75rem; color: var(--rule-text); }
  .err { font-family: var(--font-data); font-size: .875rem; }
  .err a { color: var(--stamp); }
</style>
</head>
<body>

<div class="wrap">
  <nav class="topbar" aria-label="Sections">
    <p class="topbar__mark">Status Clock</p>
    <a href="/ui/" aria-current="page">Clock Wall</a>
    <a href="/ui/ask.html">Ask</a>
    <div class="topbar__spacer"></div>
    <a href="/ui/landing.html">About</a>
  </nav>
</div>
<hr class="hairline">

<div class="wrap">
  <div class="controls">
    <div>
      <p class="ctl__label">Demo session</p>
      <div class="chips" id="personas"></div>
    </div>
    <div>
      <p class="ctl__label">Language</p>
      <div class="chips" id="langs"></div>
    </div>
  </div>
</div>
<hr class="hairline">

<div class="wrap">
  <header class="wall-head">
    <div class="wall-head__row">
      <h1 class="wall-head__name" id="person">&nbsp;</h1>
      <p class="wall-head__summary" id="summary"></p>
    </div>
    <p class="wall-head__meta" id="meta"></p>
  </header>

  <main id="wall"></main>

  <section class="notrunning" id="notrunning" hidden>
    <div class="group__head">
      <h2 class="group__title group__title--calm" id="nr-title">Not running yet</h2>
      <hr class="group__rule">
    </div>
    <ul id="nr-list"></ul>
  </section>

  <footer id="foot"></footer>
</div>

<script type="module">
/* Served by the API at /ui, so this is same-origin and the session cookie rides
   along. Set LIVE = false to fall back to the contract fixtures, which is how this
   page worked before the API existed and still works with no backend. */
const LIVE = true;
const FIXTURES = {
  sess_maria:  '../contracts/fixtures/clocks_maria_stem_opt.json',
  sess_daniel: '../contracts/fixtures/clocks_daniel_h1b.json',
};
const PERSONAS = [
  { session: 'sess_maria',  name: 'Maria',  role: 'STEM OPT' },
  { session: 'sess_daniel', name: 'Daniel', role: 'H-1B' },
];

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cookie = n => (document.cookie.match(new RegExp('(?:^|;\\s*)'+n+'=([^;]+)'))||[])[1];
const fmt = iso => new Date(iso + 'T00:00:00')
  .toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

async function load(session) {
  if (!LIVE) return (await fetch(FIXTURES[session])).json();
  const r = await fetch('/v1/clocks?as_of=2026-08-28', { credentials: 'same-origin' });
  if (!r.ok) throw new Error(`API ${r.status}`);
  return r.json();
}

/* The headline figure. Consumption clocks show used-of-budget, windows show the
   date they close, deadlines show the date they fall. */
function headline(c) {
  if (c.kind === 'consumption') return `${c.days_consumed} / ${c.denominator}`;
  if (c.kind === 'window' || c.window_end) return fmt(c.window_end).toUpperCase();
  return String(c.days_remaining);
}

/* Three numbers deserve three labels. The build spec's mock called days-remaining
   "days of work authorization"; the window length and the days gained over the
   superseded rule are different quantities and each gets named. */
function subline(c, s) {
  const bits = [];
  if (c.days_remaining !== null && c.days_remaining !== undefined)
    bits.push(`${c.days_remaining} ${s.days_remaining}`);
  if (c.kind === 'window' && c.window_days) bits.push(`${c.window_days}-${s.day_window}`);
  if (c.superseded?.delta_days) bits.push(`${c.superseded.delta_days} ${s.days_gained}`);
  return bits.join(' · ');
}

const TAGS = {
  critical: { en: 'Act now', es: 'Actúe ahora', hi: 'अभी कार्रवाई करें' },
  warn:     { en: 'Watch',   es: 'Vigilar',     hi: 'निगरानी रखें' },
  info:     { en: 'Running', es: 'En curso',    hi: 'चल रहा है' },
  clear:    { en: 'On track', es: 'En regla',   hi: 'ठीक है' },
};

function card(c, s, locale) {
  const el = document.createElement('article');
  el.className = `field-card field-card--${c.severity}`;
  el.setAttribute('role', 'group');

  /* The accessible name carries the final value and the citation from the start, and
     the animated digits are aria-hidden. Assistive tech must never read an
     intermediate number off a tick: a wrong number spoken aloud is the same harm as
     a wrong number displayed. */
  el.setAttribute('aria-label',
    `${c.label}. ${headline(c)}. ${subline(c, s)}. ` +
    `${c.provenance.citation}, ${c.provenance.authority}, effective ${c.provenance.effective_from}.` +
    (c.provenance.verified ? '' : ' ' + s.unverified + '.'));

  const top = document.createElement('div');
  top.className = 'field-card__top';
  top.innerHTML = `<p class="field-card__eyebrow"></p>
    <span class="field-card__tag field-card__tag--${c.severity}"></span>`;
  top.querySelector('.field-card__eyebrow').textContent = c.label;
  top.querySelector('.field-card__tag').textContent =
    (TAGS[c.severity] || TAGS.info)[locale] || TAGS[c.severity].en;
  el.append(top);

  if (c.superseded) {
    const prior = document.createElement('p');
    prior.className = 'field-card__prior';
    prior.setAttribute('aria-hidden', 'true');
    prior.textContent = c.superseded.prior_value;
    el.append(prior);
  }

  const count = document.createElement('p');
  count.className = `field-card__count field-card__count--${c.severity}`;
  count.setAttribute('aria-hidden', 'true');
  count.textContent = headline(c);
  el.append(count);

  const sub = document.createElement('p');
  sub.className = 'field-card__sub';
  sub.setAttribute('aria-hidden', 'true');
  sub.textContent = subline(c, s);
  el.append(sub);

  if (c.kind === 'consumption' && c.denominator) {
    const rail = document.createElement('div');
    rail.className = 'field-card__rail';
    rail.setAttribute('aria-hidden', 'true');
    const pct = Math.max(0, Math.min(100, 100 * c.days_consumed / c.denominator));
    rail.innerHTML = `<span style="width:${pct}%"></span>`;
    el.append(rail);
  }

  if (c.corpus_context) {
    const ctx = document.createElement('p');
    ctx.className = 'field-card__corpus';
    ctx.textContent = c.corpus_context.note;
    el.append(ctx);
  }

  if (c.derived && c.derivation) {
    const why = document.createElement('details');
    why.className = 'field-card__why';
    const sum = document.createElement('summary');
    sum.textContent = s.why;
    const body = document.createElement('p');
    body.textContent = c.derivation;
    why.append(sum, body);
    el.append(why);
  }

  el.append(Object.assign(document.createElement('hr'),
    { className: 'field-card__divider' }));

  const prov = document.createElement('p');
  prov.className = 'field-card__provenance';
  const a = document.createElement('a');
  a.href = c.provenance.source_url; a.rel = 'noreferrer';
  a.textContent = c.provenance.citation;
  prov.append(a, document.createTextNode(` · eff. ${c.provenance.effective_from}`));
  if (c.superseded)
    prov.append(document.createTextNode(` · ${s.supersedes} ${c.superseded.effective_from}`));
  el.append(prov);

  /* Unverified rules always show the band. There is deliberately no way to hide it. */
  if (!c.provenance.verified) {
    el.append(Object.assign(document.createElement('p'),
      { className: 'field-card__unverified', textContent: s.unverified }));
  }
  return el;
}

function tick(el, target) {
  if (reduced) return;
  const m = String(target).match(/\d+/);
  if (!m) return;
  const end = Number(m[0]), t0 = performance.now(), dur = 380;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = String(target).replace(/\d+/, String(Math.round(end * p)));
    if (p < 1) requestAnimationFrame(step); else el.textContent = String(target);
  };
  requestAnimationFrame(step);
}

function group(title, urgent, clocks, s, locale) {
  const sec = document.createElement('section');
  sec.className = 'group';
  const head = document.createElement('div');
  head.className = 'group__head';
  head.innerHTML =
    `<h2 class="group__title group__title--${urgent ? 'urgent' : 'calm'}"></h2>
     <hr class="group__rule"><span class="group__count">${clocks.length}</span>`;
  head.querySelector('.group__title').textContent = title;
  const grid = document.createElement('div');
  grid.className = 'clock-wall';
  for (const c of clocks) {
    const el = card(c, s, locale);
    grid.append(el);
    tick(el.querySelector('.field-card__count'), headline(c));
  }
  sec.append(head, grid);
  return sec;
}

function controls(data) {
  const active = cookie('sc_session') || 'sess_maria';
  const p = document.getElementById('personas');
  p.replaceChildren(...PERSONAS.map(x => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.setAttribute('aria-pressed', String(x.session === active));
    b.innerHTML = `${x.name}<small>${x.role}</small>`;
    /* Switching the SESSION, never a parameter. No endpoint anywhere accepts a user
       id, which is why persona switching has to look like signing in. */
    b.addEventListener('click', () => { window.location = `/session/${x.session}`; });
    return b;
  }));

  const l = document.getElementById('langs');
  l.replaceChildren(...(data.locales || []).map(x => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.setAttribute('aria-pressed', String(x.code === data.locale));
    b.textContent = x.name;
    b.addEventListener('click', () => { window.location = `/lang/${x.code}`; });
    return b;
  }));
}

async function render() {
  const data = await load(cookie('sc_session') || 'sess_maria');
  const s = data.strings || {};
  const locale = data.locale || 'en';
  document.documentElement.lang = locale;
  controls(data);

  document.getElementById('person').textContent = data.person?.name || '';
  document.getElementById('summary').textContent = data.person?.summary || '';

  const running = data.clocks.filter(c => c.applicable !== false);
  const notRunning = data.clocks.filter(c => c.applicable === false);
  const urgent = running.filter(c => c.severity === 'critical' || c.severity === 'warn');
  const calm   = running.filter(c => !urgent.includes(c));

  document.getElementById('meta').textContent =
    `${s.as_of || 'As of'} ${fmt(data.as_of)} · ${running.length} ${s.clocks || 'clocks'}` +
    ` · ${data.needs_attention} ${s.needs_attention || 'need attention'}`;

  const wall = document.getElementById('wall');
  wall.replaceChildren();
  if (urgent.length) wall.append(group(
    { en: 'Needs your attention', es: 'Requiere su atención', hi: 'आपके ध्यान की आवश्यकता' }[locale]
      || 'Needs your attention', true, urgent, s, locale));
  if (calm.length) wall.append(group(
    { en: 'On track', es: 'En regla', hi: 'ठीक चल रहा है' }[locale] || 'On track',
    false, calm, s, locale));

  const sec = document.getElementById('notrunning');
  sec.hidden = notRunning.length === 0;
  document.getElementById('nr-title').textContent = s.not_running || 'Not running yet';
  document.getElementById('nr-list').replaceChildren(...notRunning.map(c => {
    const li = document.createElement('li');
    const b = document.createElement('b');
    b.textContent = c.label;
    li.append(b, document.createTextNode(c.not_applicable_reason || ''));
    return li;
  }));

  document.getElementById('foot').textContent = data.disclaimer || '';
}

render().catch(err => {
  const signedOut = /401/.test(err.message);
  document.getElementById('wall').innerHTML = signedOut
    ? `<p class="err">No session. <a href="/session/sess_maria">Sign in as Maria</a>
         or <a href="/session/sess_daniel">as Daniel</a>.</p>`
    : `<p class="err" style="color:var(--urgent)">Cannot reach the API (${err.message}).
         Start it with <code>make -f Makefile.data api</code>, or set LIVE = false in
         this file to render from the contract fixtures.</p>`;
});
</script>
</body>
</html>
